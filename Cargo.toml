[package]
name = "audio-inspector"
version = "0.2.0"
edition = "2021"
description = "Shows which Bluetooth codec your headphones use and everything else Windows knows about your audio devices"
license = "MIT"
publish = false

[[bin]]
name = "AudioInspector"
path = "src/main.rs"

[dependencies]
# `default_fonts` must stay: without it egui draws no text at all.
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Only for --screenshot, the self-check that verifies the window's layout.
png = "0.17"
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Radios",
    "Media_Audio",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Devices_Usb",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
